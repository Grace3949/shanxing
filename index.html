<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山行手札</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="山行手札">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8DCC6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Serif+Display&display=swap">
<style>
/* Single light earth-tone theme by request (no dark variant). Layout: a paper notebook — one scrolling column of entry cards on cream stock, grid-paper photo mats, a cinnabar seal for each place, a frosted pill nav at the bottom. */
:root{
  --paper:#E8DCC6;        /* page */
  --card:#F3EBDC;         /* entry card */
  --mat:#D3BE96;          /* grid-paper photo mat */
  --mat-line:rgba(120,100,60,.16);
  --ink:#212A22;          /* serif display ink */
  --moss:#3C5A45;         /* accent: elevation, buttons */
  --sage:#76694F;         /* secondary text */
  --rule:#CDBEA2;
  --seal:#8A4A2C;         /* place stamp */
  --nav:rgba(246,236,216,.85);
  --field:#FAF5EC;
  --danger:#A3382A;
  --art1:#E4D3B2;--art2:#CDB287;--art3:#A2855A;--art4:#7F6A45;--sun:#E3A86B;--cloud:#FBF6EC;
  --shadow:0 1px 2px rgba(40,40,20,.08),0 8px 24px rgba(40,40,20,.08);
  color-scheme:light;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-num:"DM Serif Display","Noto Serif TC",Georgia,serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:28px}
.brand{font-family:var(--f-display);font-weight:900;font-size:clamp(52px,17vw,84px);line-height:1;letter-spacing:.02em;margin:0}
.fab{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:var(--moss);color:var(--paper);
  display:grid;place-items:center;box-shadow:var(--shadow);margin-bottom:6px}
.fab svg{width:28px;height:28px}
.tagline{font-family:var(--f-body);font-weight:700;color:var(--sage);font-size:clamp(26px,8vw,38px);line-height:1.35;margin:16px 0 0;text-wrap:balance}
.mode{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--sage);
  border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--moss)}
.mode.local i{background:var(--seal)}

.yearbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:36px}
.year{font-family:var(--f-num);font-size:clamp(64px,20vw,96px);line-height:1}
.sel{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:700 22px var(--f-body);color:var(--sage);
  padding:4px 22px 4px 4px;background-image:linear-gradient(45deg,transparent 50%,var(--sage) 50%),linear-gradient(135deg,var(--sage) 50%,transparent 50%);
  background-position:right 8px center,right 3px center;background-size:5px 5px;background-repeat:no-repeat}
.yearstats{font-weight:700;color:var(--sage);font-size:22px;margin-top:6px}
.yearstats small{display:block;font-size:14px;font-weight:500;margin-top:2px}

.month{font-weight:700;color:var(--sage);font-size:26px;margin:36px 0 14px}

/* entry card */
.list{display:flex;flex-direction:column;gap:18px}
.entry{background:var(--card);border:1.5px solid var(--rule);border-radius:34px;padding:26px 22px 24px;text-align:left;width:100%;
  display:flex;flex-direction:column;gap:18px}
.entry-date{display:flex;align-items:center;gap:14px;font-weight:700;font-size:clamp(26px,8vw,34px);letter-spacing:.04em;line-height:1}
.entry-date::after{content:"";flex:1;height:1px;background:var(--rule)}
.mat{position:relative;border-radius:22px;background-color:var(--mat);aspect-ratio:4/3;max-width:100%;overflow:hidden;
  background-image:linear-gradient(var(--mat-line) 1px,transparent 1px),linear-gradient(90deg,var(--mat-line) 1px,transparent 1px);
  background-size:21px 21px;display:grid;place-items:center}
.sticker{position:absolute;inset:0;margin:auto;width:auto;height:auto;max-width:78%;max-height:80%;border:6px solid #fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:rotate(-2.5deg);
  object-fit:contain;background:#fff}
.mat .count{position:absolute;right:12px;bottom:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.75);color:#2a2a20;border-radius:999px;padding:1px 9px}
.mat .empty{color:var(--sage);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mat .empty svg{width:34px;height:34px;opacity:.7}
.peak{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.peak-name{font-family:var(--f-display);font-weight:900;font-size:clamp(48px,15vw,72px);line-height:1.05;margin:0;min-width:0;overflow-wrap:anywhere}
.seal{flex:none;max-width:46%;border:2px solid var(--seal);color:var(--seal);border-radius:6px;padding:8px 12px;
  font-family:var(--f-display);font-weight:900;font-size:clamp(22px,7vw,32px);line-height:1.25;letter-spacing:.06em;margin-top:6px;overflow-wrap:anywhere}
.elev{font-family:var(--f-num);color:var(--moss);font-size:clamp(52px,16vw,74px);line-height:1}
.elev small{font-family:var(--f-body);font-weight:700;font-size:.5em;margin-left:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--sage)}
.facts b{color:var(--ink);font-weight:700;margin-left:4px}

/* compact row for older entries */
.row{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.row .mat{aspect-ratio:1;border-radius:20px;background-size:14px 14px}
.row .sticker{max-width:82%;max-height:82%;border-width:4px;border-radius:8px}
.row-body{min-width:0}
.row-date{font-weight:700;color:var(--sage);font-size:20px;letter-spacing:.04em}
.row-name{font-family:var(--f-display);font-weight:900;font-size:32px;line-height:1.15;overflow-wrap:anywhere}
.row-meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:var(--sage)}
.row-meta .e{font-family:var(--f-num);color:var(--moss);font-size:22px}
.row-meta .s{color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:0 6px;font-weight:700}

.blank{border:1.5px dashed var(--rule);border-radius:28px;padding:36px 22px;text-align:center;color:var(--sage);margin-top:30px}
.blank h3{font-family:var(--f-display);color:var(--ink);font-size:26px;margin:0 0 6px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--moss);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.btn.danger{background:var(--danger);color:#fff}
.blank .btn{margin-top:16px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:32px 0 14px}
.cal-head{gap:10px}.cal-head h2{min-width:0;text-align:center;font-family:var(--f-num);font-size:clamp(32px,10vw,44px);font-weight:400;margin:0;line-height:1}
.cal-head h2 span{font-family:var(--f-body);font-weight:700;font-size:24px;color:var(--sage);margin-left:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);background:transparent;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--card);border:1.5px solid var(--rule);border-radius:22px;padding:10px;width:100%;max-width:100%;overflow:hidden}
.cal .dow{text-align:center;font-size:12px;color:var(--sage);font-weight:700;padding-bottom:4px}
.day{min-width:0;width:100%;overflow:hidden;aspect-ratio:1;border-radius:10px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:15px;position:relative;padding:0}
.day.off{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 1.5px var(--rule)}
.day.has{background:var(--moss);color:var(--paper);font-weight:700}
.day.has small{display:block;font-size:9px;line-height:1.1;opacity:.9;width:100%;padding:0 2px;overflow:hidden;white-space:nowrap;text-overflow:clip;text-align:center}

/* stamps */
.stamp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
.stamp{position:relative;overflow:hidden;background:var(--card);border:1.5px solid var(--rule);border-radius:24px;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.stamp-art{position:absolute;left:0;right:0;top:0;height:132px;pointer-events:none}
.stamp-art svg{display:block;width:100%;height:100%}
.stamp > *:not(.stamp-art){position:relative}
.stamp-seal{background:rgba(246,239,226,.82)}
.hc{margin-top:22px;background:var(--card);border:1.5px solid var(--rule);border-radius:24px;padding:16px 14px 12px;display:flex;flex-direction:column;gap:8px}
.hc-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hc-head h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:22px}
.hc-head span{font-size:12px;color:var(--sage)}
.hc-legend{display:flex;align-items:center;gap:8px}.hc-legend i{width:18px;height:0;border-top:1.5px solid var(--art3)}
.hc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hc-scroll svg{display:block;height:auto;font-family:var(--f-body)}
.stamp-tier{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--art3);border:1px solid var(--art2);border-radius:999px;padding:0 8px;background:var(--card)}
.stamp-seal{border:2.5px solid var(--seal);color:var(--seal);border-radius:8px;width:92px;min-height:92px;display:grid;place-items:center;padding:6px;
  font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.1;transform:rotate(-4deg);overflow-wrap:anywhere}
.stamp-e{font-family:var(--f-num);color:var(--moss);font-size:28px;line-height:1}
.stamp-m{font-size:12px;color:var(--sage)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.total{background:var(--card);border:1.5px solid var(--rule);border-radius:20px;padding:12px}
.total b{display:block;font-family:var(--f-num);font-weight:400;font-size:30px;color:var(--ink);line-height:1.1}
.total span{font-size:12px;color:var(--sage)}
h2.sec{font-family:var(--f-display);font-weight:900;font-size:40px;margin:30px 0 0;line-height:1.1}
.sec-sub{color:var(--sage);margin:6px 0 0}

/* settings */
.set{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.set-item{background:var(--card);border:1.5px solid var(--rule);border-radius:22px;padding:18px}
.set-item h3{margin:0 0 4px;font-size:17px}
.set-item p{margin:0;color:var(--sage);font-size:14px}
.set-item .btn{margin-top:12px}
.set-item ol{margin:8px 0 0;padding-left:20px;color:var(--sage);font-size:14px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.nav-in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-radius:999px;
  background:var(--nav);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--rule);box-shadow:var(--shadow)}
.tab{border:0;background:transparent;border-radius:999px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--ink)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{background:rgba(205,190,152,.45);color:var(--moss)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;background:var(--paper)}
.sheet-bar h2{margin:0;font-size:18px}
.linkbtn{border:0;background:none;color:var(--moss);font-weight:700;font-size:17px;padding:8px 4px}
.form{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--sage);letter-spacing:.04em}
.field input,.field textarea,.field select{font:16px var(--f-body);color:var(--ink);background:var(--field);border:1.5px solid var(--rule);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--moss);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big input{font-family:var(--f-display);font-weight:900;font-size:26px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--mat);border:0;padding:0}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph .x{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:28px;padding:0}
.ph .cov{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:var(--moss);color:var(--paper);border-radius:999px;padding:1px 8px}
.ph .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);color:#fff;font-size:12px}
.addph{aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sage);font-size:13px;cursor:pointer}
.addph svg{width:28px;height:28px}
.hint{font-size:12px;color:var(--sage);margin:0}
.stars{display:flex;gap:6px}
.star{border:0;background:none;padding:2px;font-size:28px;line-height:1;color:var(--rule)}
.star.on{color:var(--seal)}
.err{color:var(--danger);font-size:14px;margin:0}
.timehint{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--sage)}
.timehint b{color:var(--ink)}
.chipbtn{border:0;border-radius:999px;background:var(--moss);color:var(--paper);font-weight:700;font-size:13px;padding:6px 12px}

/* detail */
.d-hero{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.gallery .mat{flex:0 0 100%;scroll-snap-align:center}
.gallery .sticker{max-width:88%;max-height:88%}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--moss)}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dl div{background:var(--card);border:1.5px solid var(--rule);border-radius:16px;padding:10px 12px;min-width:0}
.dl dt{font-size:12px;color:var(--sage);font-weight:700}
.dl dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.notes{background:var(--card);border:1.5px solid var(--rule);border-radius:20px;padding:16px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.confirm{background:var(--card);border:1.5px solid var(--danger);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.confirm div{display:flex;gap:10px;flex-wrap:wrap}

.sharebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 22px;font-size:16px}
.sharebtn svg{width:20px;height:20px}
.sc{position:fixed;inset:0;z-index:50;background:rgba(40,34,24,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.sc img{max-width:100%;max-height:calc(100% - 130px);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);-webkit-touch-callout:default}
.sc .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sc .btn.ghost{background:var(--card)}
.sc p{margin:0;color:#fff;font-size:13px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:56px;padding-top:18px;border-top:1px solid var(--rule)}
.foot b{font-family:var(--f-display);color:var(--moss);font-size:28px;font-weight:900;line-height:1}
.foot span{display:block;font-size:13px;color:var(--sage);margin-top:6px}
@media (prefers-reduced-motion:no-preference){.entry,.row,.stamp{transition:transform .15s}.entry:active,.row:active,.stamp:active{transform:scale(.985)}}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
.install{display:flex;flex-direction:column;gap:6px;margin-top:18px;background:var(--card);border:1.5px solid var(--seal);border-radius:20px;padding:14px 16px;font-size:14px;color:var(--ink)}
.install b{color:var(--seal)}
.install ol{margin:0;padding-left:20px;color:var(--sage)}
.set-item .row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.set-item .row2 .btn{margin-top:0}
.progress{font-size:14px;color:var(--moss);font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1 class="brand">山行手札</h1>
    <button class="fab" id="fab" aria-label="新增一次登山"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>
  <main id="view"><p class="tagline">正在翻開手札…</p></main>
  <footer class="foot"><div><b>山行手札</b><span>一山一印，收藏走過的山。</span></div><span id="foot-mode"></span></footer>
</div>

<nav class="nav" aria-label="主選單"><div class="nav-in">
  <button class="tab" data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5v0A1.5 1.5 0 0 0 6.5 21H19"/><path d="M5 4.5v15"/></svg>手札</button>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDate = s => s ? s.replaceAll("-", ".") : "";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const ICON_PHOTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg>';

let state = { hikes: [], tab: "journal", year: "all", calY: new Date().getFullYear(), calM: new Date().getMonth(), loaded:false };
let store = null; let readyBackup = null; // {mode, subscribe, save, remove, uploadPhoto}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 2400); }

/* ---------- photo compression ---------- */
function compress(file, max=1600, q=0.82){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let {naturalWidth:w, naturalHeight:h} = img; const k = Math.min(1, max/Math.max(w,h));
      w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error("壓縮失敗")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("這張照片的格式讀不出來")); };
    img.src = url;
  });
}
/* EXIF 拍攝時間：照片內以 "YYYY:MM:DD HH:MM:SS" 純文字存放，JPEG 與 HEIC 都適用；取最早的一個（原始拍攝時間） */
async function photoTakenAt(file){
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const head = buf.length > 262144 ? [buf.subarray(0,262144), buf.subarray(buf.length-262144)] : [buf];
    let best = null;
    for (const part of head){
      let s = ""; for (let i=0;i<part.length;i+=8192) s += String.fromCharCode.apply(null, part.subarray(i,i+8192));
      for (const m of s.matchAll(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):\d{2}/g)){
        const [_,y,mo,d,h,mi] = m; if (+y<1990 || +y>2100 || +mo<1 || +mo>12 || +d<1 || +d>31 || +h>23 || +mi>59) continue;
        const v = `${y}-${mo}-${d}T${h}:${mi}`; if (!best || v<best) best=v;
      }
    }
    return best;
  } catch(e){ return null; }
}
const blobToDataURL =b => new Promise(r => { const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); });

/* ---------- store：全部存在這支手機的 IndexedDB（照片以 Blob 另存） ---------- */
const urls = {};               // photo id -> object URL
function deviceStore(){
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open("shanxing-app", 1);
    r.onupgradeneeded = () => { const d=r.result; d.createObjectStore("hikes",{keyPath:"id"}); d.createObjectStore("photos",{keyPath:"id"}); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const req = q => new Promise((res,rej)=>{ q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  const tx = async (stores, fn) => { const d=await dbp; return new Promise((res,rej)=>{ const t=d.transaction(stores,"readwrite"); fn(t); t.oncomplete=res; t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error("儲存空間不足")); }); };
  let listeners=[];
  const all = async () => { const d=await dbp; return req(d.transaction("hikes").objectStore("hikes").getAll()); };
  const emit = async () => { const l=await all().catch(()=>[]); listeners.forEach(f=>f(l)); };
  return {
    async loadPhotos(){ const d=await dbp; const rows=await req(d.transaction("photos").objectStore("photos").getAll());
      rows.forEach(r=>{ if (!urls[r.id]) urls[r.id]=URL.createObjectURL(r.blob); }); return rows.length; },
    subscribe(cb, onErr){ listeners.push(cb); all().then(cb).catch(e=>{ onErr&&onErr(e); cb([]); }); },
    async save(h){ await tx(["hikes"], t=>t.objectStore("hikes").put(h)); emit(); },
    async remove(h){ await tx(["hikes","photos"], t=>{ t.objectStore("hikes").delete(h.id); (h.photos||[]).forEach(p=>p.id&&t.objectStore("photos").delete(p.id)); });
      (h.photos||[]).forEach(p=>{ if(urls[p.id]){ URL.revokeObjectURL(urls[p.id]); delete urls[p.id]; } }); emit(); },
    async uploadPhoto(blob){ const id=uid(); await tx(["photos"], t=>t.objectStore("photos").put({id, blob})); urls[id]=URL.createObjectURL(blob); return {id}; },
    async getPhoto(id){ const d=await dbp; const r=await req(d.transaction("photos").objectStore("photos").get(id)); return r&&r.blob; },
    async putMany(hikes, photos){ // photos: [{id, blob}]
      for (const ph of photos){ await tx(["photos"], t=>t.objectStore("photos").put(ph)); if(!urls[ph.id]) urls[ph.id]=URL.createObjectURL(ph.blob); }
      await tx(["hikes"], t=>hikes.forEach(h=>t.objectStore("hikes").put(h))); emit(); },
    async dropPhotos(ids){ if(!ids.length) return; await tx(["photos"], t=>ids.forEach(id=>t.objectStore("photos").delete(id))); ids.forEach(id=>{ if(urls[id]){ URL.revokeObjectURL(urls[id]); delete urls[id]; } }); },
    async usage(){ try { const e=await navigator.storage.estimate(); return e; } catch(e){ return null; } }
  };
}

/* ---------- derived ---------- */
const sorted = () => [...state.hikes].sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
const years = () => [...new Set(state.hikes.map(h => (h.date||"").slice(0,4)).filter(Boolean))].sort().reverse();
const inYear = h => state.year==="all" || (h.date||"").startsWith(state.year);
const durText = h => {
  if (!h.startTime || !h.endTime) return "";
  const [a,b]=h.startTime.split(":").map(Number), [c,d]=h.endTime.split(":").map(Number);
  let m=(c*60+d)-(a*60+b); if (m<=0) m+=1440; return `${Math.floor(m/60)} 小時 ${pad(m%60)} 分`;
};
const cover = h => (h.photos||[])[0];
const photoSrc = p => p && p.id ? (urls[p.id] || "") : "";

/* ---------- views ---------- */
const standalone = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
function installHint(){
  if (standalone()) return "";
  return `<div class="install"><b>先加入主畫面再開始記錄</b><span>從主畫面圖示打開的手札，資料會存在 App 裡；在 Safari 分頁裡記的資料，不會出現在主畫面的 App。</span>
    <ol><li>點 Safari 下方的「分享」</li><li>選「加入主畫面」→「新增」</li><li>之後都從主畫面的「山行手札」打開</li></ol></div>`;
}
function matHTML(h, cls=""){
  const p = cover(h), n = (h.photos||[]).length;
  return `<div class="mat ${cls}">${p ? `<img class="sticker" src="${esc(photoSrc(p))}" alt="${esc(h.mountain)} 的照片" loading="lazy">` : `<div class="empty">${ICON_PHOTO}<span>還沒有照片</span></div>`}${n>1?`<span class="count">${n} 張</span>`:""}</div>`;
}
function factsHTML(h){
  const f = [];
  if (h.trail) f.push(["路線", h.trail]);
  const d = durText(h); if (d) f.push(["歷時", d]);
  if (h.distanceKm) f.push(["距離", h.distanceKm+" km"]);
  if (h.ascentM) f.push(["爬升", h.ascentM+" m"]);
  if (h.companions) f.push(["同行", h.companions]);
  return f.length ? `<div class="facts num">${f.map(([k,v])=>`<span>${k}<b>${esc(v)}</b></span>`).join("")}</div>` : "";
}
function bigCard(h){
  return `<button class="entry" data-open="${esc(h.id)}">
    <div class="entry-date num">${fmtDate(h.date)}</div>
    ${matHTML(h)}
    <div class="peak"><h3 class="peak-name">${esc(h.mountain||"未命名")}</h3>${h.region?`<div class="seal">${esc(h.region)}</div>`:""}</div>
    ${h.elevation?`<div class="elev num">${esc(h.elevation)}<small>m</small></div>`:""}
    ${factsHTML(h)}
  </button>`;
}
function rowCard(h){
  return `<button class="row" data-open="${esc(h.id)}">${matHTML(h)}
    <div class="row-body"><div class="row-date num">${fmtDate(h.date)}</div><div class="row-name">${esc(h.mountain||"未命名")}</div>
    <div class="row-meta">${h.elevation?`<span class="e num">${esc(h.elevation)} m</span>`:""}${h.region?`<span class="s">${esc(h.region)}</span>`:""}</div></div></button>`;
}

function viewJournal(){
  const list = sorted().filter(inYear);
  const peaks = new Set(list.map(h=>h.mountain)).size;
  const ys = years();
  if (state.year!=="all" && !ys.includes(state.year)) state.year="all";
  const label = state.year==="all" ? (ys[0] || String(new Date().getFullYear())) : state.year;
  const ascent = list.reduce((s,h)=>s+(+h.ascentM||0),0);
  let html = `<p class="tagline">${state.hikes.length ? `${state.hikes.length} 段回憶，都在這裡。` : "第一座山，從這裡開始。"}</p>
    <div class="mode"><i></i>存在這支 iPhone，不用登入</div>${installHint()}`;
  if (!state.hikes.length){
    return html + `<div class="blank"><h3>手札還是空白的</h3><p>按右上角的 ＋，記下這次爬的山、時間、地點和照片。</p><button class="btn" data-act="new">寫下第一筆</button></div>`;
  }
  html += `<div class="yearbar"><div class="year num">${state.year==="all"?"全部":label}</div>
    <select class="sel" id="yearSel" aria-label="選擇年份"><option value="all">全部年份</option>${ys.map(y=>`<option value="${y}" ${y===state.year?"selected":""}>${y}</option>`).join("")}</select></div>
    <div class="yearstats num">${list.length} 段回憶 · ${peaks} 座山${ascent?`<small>累積爬升 ${ascent.toLocaleString()} m</small>`:""}</div>`;
  let curKey = "", first = true;
  for (const h of list){
    const key = (h.date||"").slice(0,7);
    if (key!==curKey){
      if (curKey) html += `</div>`;
      const [y,m] = key.split("-");
      html += `<div class="month">${state.year==="all"?`${y} 年 `:""}${+m} 月</div><div class="list">`; curKey=key;
    }
    html += first ? bigCard(h) : rowCard(h); first=false;
  }
  return html + `</div>`;
}

function viewCalendar(){
  const y=state.calY, m=state.calM, first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  const byDay = {}; state.hikes.forEach(h => { if ((h.date||"").startsWith(`${y}-${pad(m+1)}`)) (byDay[+h.date.slice(8,10)] ||= []).push(h); });
  const t = todayStr();
  let cells = ["日","一","二","三","四","五","六"].map(d=>`<div class="dow">${d}</div>`).join("");
  for (let i=0;i<first;i++) cells += `<span class="day off"></span>`;
  for (let d=1; d<=days; d++){
    const hs = byDay[d], ds=`${y}-${pad(m+1)}-${pad(d)}`;
    cells += hs ? `<button class="day has num ${ds===t?"today":""}" data-open="${esc(hs[0].id)}" aria-label="${ds} ${esc(hs[0].mountain)}">${d}<small>${esc(hs[0].mountain)}</small></button>`
               : `<span class="day num ${ds===t?"today":""}">${d}</span>`;
  }
  const monthList = sorted().filter(h => (h.date||"").startsWith(`${y}-${pad(m+1)}`));
  return `<h2 class="sec">月曆</h2><p class="sec-sub">綠色的日子，都有上山。</p>
    <div class="cal-head"><button class="iconbtn" data-cal="-1" aria-label="上個月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
      <h2 class="num">${y}<span>${m+1} 月</span></h2>
      <button class="iconbtn" data-cal="1" aria-label="下個月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button></div>
    <div class="cal">${cells}</div>
    <div class="list" style="margin-top:22px">${monthList.length ? monthList.map(rowCard).join("") : `<p class="sec-sub">這個月還沒有登山紀錄。</p>`}</div>`;
}

/* 每座山一張小插圖：依山名產生固定的山稜、太陽或月亮、雲與松樹；越高的山稜越陡 */
function mtnArt(name, elev){
  let h=2166136261; for (const c of String(name)) { h^=c.codePointAt(0); h=Math.imul(h,16777619); }
  const rnd=()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; };
  const W=200, H=132, e=+elev||800, tall=Math.min(1, Math.max(.25, e/3500));
  const ridge=(base, amp, steps, jag, pk=.25+rnd()*.5)=>{ let d=`M0 ${H}L0 ${base}`, px=0, py=H;
    for (let i=1;i<=steps;i++){ const x=i/steps*W, dist=Math.abs(i/steps-pk);
      const y=base-amp*Math.max(0,1-dist*2.2)-(rnd()-.5)*jag; d+=`L${x.toFixed(1)} ${y.toFixed(1)}`; if (y<py){py=y;px=x;} }
    return {d:d+`L${W} ${H}Z`, px, py}; };
  const side=rnd()<.5, far=ridge(H-40, 36+40*tall, 10, 4, side ? .16+rnd()*.06 : .78+rnd()*.06), mid=ridge(H-24, 22+44*tall, 9, 14).d, near=ridge(H-8, 10+18*tall, 11, 8).d;
  const flag=`<g><path d="M${far.px} ${far.py}V${far.py-16}" stroke="var(--art4)" stroke-width="1.4"/><path d="M${far.px} ${far.py-16}l${side?9:-9} 3.5L${far.px} ${far.py-9}Z" fill="var(--seal)"/></g>`;
  const sx=30+rnd()*140, sy=22+rnd()*14, night=rnd()<.3;
  const sun = night ? `<circle cx="${sx}" cy="${sy}" r="10" fill="var(--sun)" opacity=".75"/><circle cx="${sx+5}" cy="${sy-3}" r="9" fill="var(--card)"/>`
                    : `<circle cx="${sx}" cy="${sy}" r="11" fill="var(--sun)" opacity=".55"/>`;
  const cx=20+rnd()*150, cy=30+rnd()*18;
  const cloud=`<g fill="var(--cloud)" opacity=".9"><ellipse cx="${cx}" cy="${cy}" rx="16" ry="5"/><ellipse cx="${cx+9}" cy="${cy-4}" rx="9" ry="5"/></g>`;
  let trees=""; const n=3+Math.floor(rnd()*4);
  for (let i=0;i<n;i++){ const tx=8+rnd()*184, ts=6+rnd()*6, ty=H-4-rnd()*6;
    trees+=`<path d="M${tx} ${ty-ts*2}L${tx-ts*.6} ${ty-ts*.6}L${tx+ts*.6} ${ty-ts*.6}Z M${tx} ${ty-ts*1.4}L${tx-ts*.8} ${ty}L${tx+ts*.8} ${ty}Z" fill="var(--art4)" opacity=".55"/>`; }
  return `<div class="stamp-art" aria-hidden="true"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice">
    ${sun}${cloud}<path d="${far.d}" fill="var(--art1)"/>${elev?flag:""}<path d="${mid}" fill="var(--art2)" opacity=".75"/>${trees}<path d="${near}" fill="var(--art3)" opacity=".35"/>
    <rect y="${H-1}" width="${W}" height="1" fill="var(--card)"/></svg></div>`;
}
/* 高度比較：所有填了海拔的山，依同一比例尺並排 */
function heightChart(arr){
  const ms = arr.filter(e=>+e.elev>0).sort((a,b)=>a.elev-b.elev); if (!ms.length) return "";
  const top = Math.max(...ms.map(e=>+e.elev)), step = top>2500?1000:top>1200?500:200, max = Math.ceil(top*1.12/step)*step;
  const slot=74, padL=44, padR=14, W=Math.max(340, padL+padR+ms.length*slot), H=230, base=196, sky=34;
  const y = v => base-(v/max)*(base-sky);
  let g="";
  for (let v=0; v<=max; v+=step) g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1" ${v?'stroke-dasharray="2 4"':''}/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--sage)">${v.toLocaleString()}</text>`;
  const tiers=[];
  [[1000,"中級山"],[3000,"高山"]].forEach(([v,t])=>{ if (v<max) g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--art3)" stroke-width="1.2"/>`; tiers.push(`${t} ${v.toLocaleString()} m`); });
  let peaks="";
  ms.forEach((e,i)=>{ const cx=padL+slot*(i+.5), py=y(+e.elev), hw=slot*.62;
    peaks+=`<g class="hc-peak" data-open="${esc(e.last.id)}" style="cursor:pointer">
      <path d="M${cx-hw} ${base}L${cx-hw*.35} ${(py+base)/2+6}L${cx} ${py}L${cx+hw*.4} ${(py+base)/2}L${cx+hw} ${base}Z" fill="var(--art2)" opacity=".8" stroke="var(--card)" stroke-width="1.5"/>
      <path d="M${cx} ${py}L${cx-hw*.18} ${py+(base-py)*.22}L${cx+hw*.2} ${py+(base-py)*.2}Z" fill="var(--cloud)" opacity=".7"/>
      <path d="M${cx} ${py}V${py-14}" stroke="var(--art4)" stroke-width="1.4"/><path d="M${cx} ${py-14}l9 3.5L${cx} ${py-7}Z" fill="var(--seal)"/>
      <text x="${cx}" y="${py-19}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--moss)" font-family="DM Serif Display,Georgia,serif">${esc(e.elev)} m</text>
      <text x="${cx}" y="${base+18}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${esc(e.name.length>5?e.name.slice(0,5)+"…":e.name)}</text></g>`; });
  const miss = arr.length-ms.length;
  return `<div class="hc"><div class="hc-head"><h3>高度比較</h3><span>同一比例尺，單位 m</span></div>
    <div class="hc-scroll"><svg viewBox="0 0 ${W} ${H}" ${W>360?`width="${W}"`:'width="100%"'} role="img" aria-label="走過的山海拔比較">${g}${peaks}<line x1="${padL}" x2="${W-padR}" y1="${base}" y2="${base}" stroke="var(--art3)" stroke-width="1.5"/></svg></div>
    ${tiers.length?`<p class="hint hc-legend"><i></i>實線為${tiers.join("、")}的分界</p>`:""}${miss?`<p class="hint">還有 ${miss} 座山沒填海拔，補上後就會出現在這裡。</p>`:""}</div>`;
}
const tierOf = e => { e=+e; if (!e) return ""; return e>=3000 ? "高山" : e>=1000 ? "中級山" : "郊山"; };
function viewStamps(){
  const map = new Map();
  sorted().forEach(h => { const k=h.mountain||"未命名"; const e=map.get(k)||{name:k, n:0, last:h, elev:h.elevation, region:h.region}; e.n++; map.set(k,e); });
  const arr = [...map.values()];
  const highest = arr.reduce((a,b)=> (+b.elev||0)>(+a?.elev||0)?b:a, null);
  const ascent = state.hikes.reduce((s,h)=>s+(+h.ascentM||0),0);
  return `<h2 class="sec">山印</h2><p class="sec-sub">一山一印，收藏走過的山。</p>

/* ---------- 分享圖卡：1080×1350，手札風格 ---------- */
let cardFile = null;
function rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  const txt = [h.mountain,h.region,h.trail,h.companions,"山行手札一山一印收藏走過的山路線歷時同行小時分", fmtDate(h.date)].join("");
  try { await Promise.all([document.fonts.load(`900 120px ${SERIF}`, txt), document.fonts.load(`700 40px ${SANS}`, txt), document.fonts.load(`400 40px ${SANS}`, txt), document.fonts.load(`120px ${NUM}`, "0123456789 m")]); } catch(e){}

  const L=96, R=W-96;

  const dw=c.measureText(ds).width; c.fillStyle=T("--rule"); c.fillRect(L+dw+28, 130, R-(L+dw+28), 2);

    const im = await loadImg(photo); const k=Math.min(mw*.8/im.width, mh*.84/im.height), pw=im.width*k, ph=im.height*k, B=14;
    c.translate(mx+mw/2, my+mh/2); c.rotate(-2.5*Math.PI/180);

    c.save(); rrect(c,-pw/2,-ph/2,pw,ph,10); c.clip(); c.drawImage(im,-pw/2,-ph/2,pw,ph); c.restore();
  }
  c.restore();
  // seal (region) on the right
  let sealW=0, sealH=0;
  if (h.region){
    c.font=`900 50px ${SERIF}`; const chars=[...h.region], per = chars.length>4 ? Math.ceil(chars.length/2) : chars.length;
    const lines = chars.length>4 ? [chars.slice(0,per).join(""), chars.slice(per).join("")] : [h.region];
    sealW = Math.min(360, Math.max(...lines.map(l=>c.measureText(l).width))+56); sealH = lines.length*64+40;
    const sx=R-sealW, sy=780; c.lineWidth=5; c.strokeStyle=T("--seal"); rrect(c,sx,sy,sealW,sealH,10); c.stroke();
    c.fillStyle=T("--seal"); lines.forEach((l,i)=>{ c.fillText(l, sx+28, sy+20+52+i*64, sealW-56); });
  }

  while (c.measureText(h.mountain||"").width>nameMax && fs>64){ fs-=6; c.font=`900 ${fs}px ${SERIF}`; }
  c.fillStyle=T("--ink"); c.fillText(h.mountain||"未命名", L, 780+fs*.92);
  // elevation
  let y = 780 + Math.max(fs*1.05, sealH) + 10;
  if (h.elevation){ c.fillStyle=T("--moss"); c.font=`130px ${NUM}`; c.fillText(h.elevation, L, y+110); const ew=c.measureText(h.elevation).width; c.font=`700 64px ${SANS}`; c.fillText("m", L+ew+16, y+110); y+=140; }
  // facts
  const facts=[]; if (h.trail) facts.push(["路線",h.trail]); const d=durText(h); if (d) facts.push(["歷時",d]); if (h.companions) facts.push(["同行",h.companions]);
  if (facts.length){ let x=L; c.font=`400 34px ${SANS}`; for (const [k,v] of facts){ c.fillStyle=T("--sage"); c.font=`400 34px ${SANS}`; const kw=c.measureText(k+" ").width;
      c.font=`700 34px ${SANS}`; const vw=c.measureText(v).width; if (x+kw+vw>R && x>L) break;
      c.fillStyle=T("--sage"); c.font=`400 34px ${SANS}`; c.fillText(k, x, y+40); c.fillStyle=T("--ink"); c.font=`700 34px ${SANS}`; c.fillText(v, x+kw, y+40, R-x-kw); x+=kw+vw+44; } }
  // footer
  c.fillStyle=T("--rule"); c.fillRect(L, H-150, R-L, 2);
  c.fillStyle=T("--moss"); c.font=`900 50px ${SERIF}`; c.fillText("山行手札", L, H-82);
  c.fillStyle=T("--sage"); c.font=`400 28px ${SANS}`; c.textAlign="right"; c.fillText("一山一印，收藏走過的山。", R, H-86); c.textAlign="left";
  return new Promise(r=>cv.toBlob(r,"image/jpeg",.9));
}

function renderStars(){ const s=$("#stars"); if(!s) return; s.innerHTML=[1,2,3,4,5].map(i=>`<button type="button" class="star ${i<=draft.rating?"on":""}" data-star="${i}" aria-label="${i} 顆星">★</button>`).join(""); }
function renderPhotos(){
  const el=$("#photos"); if(!el) return;
  el.innerHTML = draft.photos.map((p,i)=>`<div class="ph"><button type="button" class="ph" style="width:100%;height:100%" data-cover="${i}" aria-label="設為封面"><img src="${esc(p.preview||photoSrc(p))}" alt=""></button>

    + `<label class="addph" for="picker">${ICON_PHOTO}<span>加入照片</span></label>`;
}
async function addFiles(files){
  for (const file of files){
    const slot = {busy:true, preview:URL.createObjectURL(file)}; draft.photos.push(slot); draft._pending++; renderPhotos();
    slot.takenAt = await photoTakenAt(file);
    if (slot.takenAt) applyTimes(false);
    try { const blob = await compress(file); const r = await store.uploadPhoto(blob); Object.assign(slot, r); }
    catch(e){ draft.photos.splice(draft.photos.indexOf(slot),1); toast(e.message || "照片存不進去，請再試一次"); }

  }

function photoTimes(){
  const ts = draft.photos.map(p=>p.takenAt).filter(Boolean).sort(); if (!ts.length) return null;
  const day = ts[0].slice(0,10), same = ts.filter(t=>t.startsWith(day));
  return {date:day, start:same[0].slice(11), end:same[same.length-1].slice(11)};
}
function setField(k, v){ draft[k]=v; const el=$("#f-"+k); if (el) el.value=v; }
/* auto=false：新紀錄自動填入使用者還沒動過的欄位；force=true：按「套用」時覆寫 */
function applyTimes(force){

  const can = k => force || (draft._new && !draft._touched[k]) || (!draft[k] && !draft._touched[k]);
  if (can("date")) setField("date", t.date);
  if (can("startTime")) setField("startTime", t.start);
  if (t.end !== t.start && can("endTime")) setField("endTime", t.end);

}

  el.hidden = false;
  el.innerHTML = `<span>照片拍攝於 <b class="num">${fmtDate(t.date)} ${range}</b>${same?"，已帶入":""}</span>${same?"":`<button type="button" class="chipbtn" data-act="applytime">套用到日期與時間</button>`}`;
}

  h.mountain = h.mountain.trim(); h.photos = h.photos.filter(p=>p.id).map(({id,takenAt})=>({id,takenAt:takenAt||null})); h.updatedAt = Date.now();

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-open],[data-act],[data-cal],[data-cover],[data-rmph],[data-star]"); if (!t) return;
  if (t.dataset.tab){ state.tab=t.dataset.tab; if (!readyBackup) state.io=""; render(); window.scrollTo(0,0); return; }
  if (t.dataset.open){ openDetail(t.dataset.open); return; }
  if (t.dataset.cal){ state.calM += +t.dataset.cal; if(state.calM<0){state.calM=11;state.calY--;} if(state.calM>11){state.calM=0;state.calY++;} render(); return; }
  if (t.dataset.cover){ const i=+t.dataset.cover; if(i>0){ const [p]=draft.photos.splice(i,1); draft.photos.unshift(p); renderPhotos(); } return; }
  if (t.dataset.rmph){ draft.photos.splice(+t.dataset.rmph,1); renderPhotos(); renderTimeHint(); return; }
  if (t.dataset.star){ const v=+t.dataset.star; draft.rating = draft.rating===v?0:v; renderStars(); return; }
  const a = t.dataset.act, sid = $("#sheet").dataset.id;
  if (a==="new") openEditor();
  else if (a==="close") closeSheet();
  else if (a==="back") openDetail(t.dataset.id);
  else if (a==="edit") openEditor(t.dataset.id);
  else if (a==="save") saveDraft();
  else if (a==="applytime") applyTimes(true);
  else if (a==="askdel") $("#delzone").innerHTML = `<div class="confirm"><b>確定刪除這筆紀錄和照片？</b><span class="hint">刪除後無法復原。</span><div><button class="btn danger" data-act="del">刪除</button><button class="btn ghost" data-act="nodel">保留</button></div></div>`;
  else if (a==="nodel") $("#delzone").innerHTML = `<button class="btn ghost" data-act="askdel">刪除這筆紀錄</button>`;
  else if (a==="del"){ const h=state.hikes.find(x=>x.id===sid); if(!h) return;
    try { await store.remove(h); state.hikes=state.hikes.filter(x=>x.id!==h.id); closeSheet(); render(); toast("已刪除"); } catch(err){ toast("刪除失敗，請再試一次"); } }
  else if (a==="export") exportData();
  else if (a==="sharecard") openShareCard(sid);
  else if (a==="sharego") shareCardGo();
  else if (a==="sharex") closeShareCard();
  else if (a==="import") $("#importer").click();
});
$("#fab").addEventListener("click", () => openEditor());
$("#picker").addEventListener("change", e => { const fs=[...e.target.files]; e.target.value=""; if (draft) addFiles(fs); });

/* ---------- 備份：ZIP（hikes.json + photos/<id>.jpg，不壓縮存放）；也能讀舊的 JSON 備份 ---------- */
const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = u => { let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c = CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function makeZip(files){ // files: [{name, data:Uint8Array}]
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  for (const f of files){
    const nm=enc.encode(f.name), crc=crc32(f.data), n=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,n,true); h.setUint32(22,n,true); h.setUint16(26,nm.length,true);
    parts.push(h.buffer,nm,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint32(16,crc,true); c.setUint32(20,n,true); c.setUint32(24,n,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(c.buffer,nm); off += 30+nm.length+n;
  }
  const cenSize = cen.reduce((s,x)=>s+(x.byteLength??x.length),0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cenSize,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:"application/zip"});
}
async function readZip(buf){
  const v=new DataView(buf), u=new Uint8Array(buf), dec=new TextDecoder(); let e=-1;
  for (let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--) if (v.getUint32(i,true)===0x06054b50){ e=i; break; }
  if (e<0) throw new Error("壓縮檔損壞或不完整");
  let p=v.getUint32(e+16,true); const count=v.getUint16(e+10,true), out={};
  for (let k=0;k<count;k++){
    if (v.getUint32(p,true)!==0x02014b50) throw new Error("壓縮檔格式不對");
    const method=v.getUint16(p+10,true), csize=v.getUint32(p+20,true), nlen=v.getUint16(p+28,true), xlen=v.getUint16(p+30,true), clen=v.getUint16(p+32,true), lo=v.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nlen)); p += 46+nlen+xlen+clen;
    const start = lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true); const raw=u.subarray(start,start+csize);
    if (name.endsWith("/")) continue;
    if (method===0) out[name]=raw;
    else if (method===8 && "DecompressionStream" in window) out[name]=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    else throw new Error("這個壓縮檔的格式手機讀不了");
  }
  return out;
}
const b64ToBlob = (b64, type="image/jpeg") => { const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); };
const ioMsg = m => { state.io = m||""; const el=$("#ioMsg"); if (el){ el.hidden=!m; el.textContent=m||""; } };
async function exportData(){
  if (readyBackup){ return shareBackup(); }
  const btn=$("#expBtn"); if (btn) btn.disabled=true;
  try {
    const hikes = sorted(), files=[];
    const ids = hikes.flatMap(h=>(h.photos||[]).map(p=>p.id)).filter(Boolean); let i=0;
    for (const id of ids){ ioMsg(`正在打包照片 ${++i}／${ids.length}`); const b=await store.getPhoto(id); if(!b) continue;
      files.push({name:`photos/${id}.jpg`, data:new Uint8Array(await b.arrayBuffer())}); }
    files.unshift({name:"hikes.json", data:new TextEncoder().encode(JSON.stringify({app:"山行手札",version:3,exportedAt:new Date().toISOString(),hikes},null,1))});
    readyBackup = new File([makeZip(files)], `山行手札備份-${todayStr()}.zip`, {type:"application/zip"});
    ioMsg(`備份檔準備好了（${(readyBackup.size/1048576).toFixed(1)} MB），再按一次儲存。`);
    if (btn){ btn.disabled=false; btn.textContent="儲存備份檔"; }
  } catch(e){ ioMsg(""); if (btn) btn.disabled=false; toast("打包失敗："+(e.message||"請再試一次")); }
}
async function shareBackup(){
  const f = readyBackup;
  try {
    if (navigator.canShare && navigator.canShare({files:[f]})) { await navigator.share({files:[f], title:"山行手札備份"}); }
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 60000); }
    ioMsg("已交給系統儲存。建議選「儲存到檔案」。");
  } catch(e){ if (e.name!=="AbortError") toast("沒有儲存："+(e.message||"")); }
  readyBackup=null; const btn=$("#expBtn"); if (btn) btn.textContent="匯出備份";
}
async function importData(file){
  try {
    ioMsg("正在讀取備份檔…");
    let hikesIn, photos=[];
    const buf = await file.arrayBuffer(), head = new Uint8Array(buf,0,2);
    if (head[0]===0x50 && head[1]===0x4b){ // ZIP
      const z = await readZip(buf);
      if (!z["hikes.json"]) throw new Error("備份檔裡找不到紀錄");
      hikesIn = JSON.parse(new TextDecoder().decode(z["hikes.json"])).hikes;
      for (const [name,data] of Object.entries(z)) { const m=name.match(/^photos\/(.+)\.jpe?g$/i); if (m) photos.push([m[1], ()=>new Blob([data],{type:"image/jpeg"})]); }
    } else {
      const data = JSON.parse(new TextDecoder().decode(buf)); hikesIn = data && data.hikes;
      photos = Object.entries(data.photos||{}).map(([id,b64])=>[id, ()=>b64ToBlob(b64)]);
    }
    if (!Array.isArray(hikesIn)) throw new Error("這不是山行手札的備份檔");
    const out=[]; let i=0;
    for (const [id,mk] of photos){ ioMsg(`正在匯入照片 ${++i}／${photos.length}`); out.push({id, blob:mk()}); if (out.length>=10){ await store.putMany([], out.splice(0)); } }
    const hikes = hikesIn.map(h=>({...h, photos:(h.photos||[]).filter(p=>p.id).map(({id,takenAt})=>({id,takenAt:takenAt||null}))}));
    await store.putMany(hikes, out);
    ioMsg(`匯入完成：${hikes.length} 筆紀錄、${photos.length} 張照片。`); toast("備份已匯入");
  } catch(e){ ioMsg(""); toast("匯入失敗："+(e.message||"檔案讀不出來")); }
}
$("#importer").addEventListener("change", e => { const f=e.target.files[0]; e.target.value=""; if (f) importData(f); });

/* ---------- boot ---------- */
render();
async function boot(){
  store = deviceStore();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  try { await store.loadPhotos(); } catch(e){}
  store.subscribe(list => { state.hikes=list; state.loaded=true; render(); },
    () => { state.loaded=true; render(); toast("讀取紀錄失敗，請重新打開 App"); });
}
boot();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
